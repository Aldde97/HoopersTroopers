<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Basketball Manager Euroleague</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;0,900;1,800;1,900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: broadcast-style manager desk. Black header band with a diagonal white brand plate, orange kept for "go" actions and your club, white data cards on cool grey. One committed light look. */
:root{
  --or:#ff6b00;--or2:#ff8a1f;--orS:#fff1e4;--orL:#ffe2c7;
  --ink:#121417;--ink2:#1b1e23;--ink3:#2b3038;--inkT:#e9ecef;--inkM:#8d949d;
  --bg:#e4e7eb;--card:#ffffff;--line:#e1e4e8;--soft:#f4f5f7;--tx:#15181c;--mut:#69717b;
  --g:#1e9b50;--r:#d6342c;--b:#2f6fd6;--y:#e0a400;
  --fd:"Barlow Condensed","Arial Narrow","Helvetica Neue",sans-serif;
  --fb:"Barlow","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--tx)}
body{font-family:var(--fb);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--or);outline-offset:2px}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3,h4{text-wrap:balance}
.num,table{font-variant-numeric:tabular-nums}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.c{font-family:var(--fd);text-transform:uppercase;letter-spacing:.06em}
.mut{color:var(--mut)}.pos{color:var(--g)}.neg{color:var(--r)}.orc{color:var(--or)}

/* ===== Header ===== */
.hdr{display:flex;background:var(--ink);color:var(--inkT);min-height:100px;position:relative}
.brand{flex:none;width:500px;padding:12px 96px 12px max(28px,env(safe-area-inset-left,0px));background:linear-gradient(115deg,#ffffff,#eceef1);clip-path:polygon(0 0,100% 0,84% 100%,0 100%);color:var(--ink);display:flex;flex-direction:column;justify-content:center;position:relative;z-index:2}
.stripe{position:absolute;left:418px;top:0;width:100px;height:100%;background:var(--or);clip-path:polygon(80% 0,100% 0,20% 100%,0 100%);z-index:3}
.t1{font:900 38px/.92 var(--fd);letter-spacing:.01em}
.t2{font:italic 900 34px/1 var(--fd);color:var(--or);display:flex;gap:10px;align-items:center;letter-spacing:.02em}
.t2 small{font:normal 700 12px var(--fd);letter-spacing:.25em;background:var(--ink);color:var(--inkT);padding:3px 7px 2px}
.hmid{flex:1;min-width:0;display:flex;align-items:center;gap:30px;padding:12px 24px 12px 44px;overflow-x:auto;background:radial-gradient(ellipse at 20% 140%,#2c3037 0,transparent 60%),repeating-linear-gradient(135deg,#ffffff05 0 2px,transparent 2px 9px),var(--ink)}
.date b{display:block;font:800 26px/1 var(--fd);color:var(--or2);letter-spacing:.04em;white-space:nowrap}
.date span{font:600 16px var(--fd);color:#c8cdd3;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.hstat{border-left:1px solid #ffffff1f;padding-left:20px;white-space:nowrap}
.hstat small{display:block;font:600 12px var(--fd);letter-spacing:.18em;color:var(--inkM);text-transform:uppercase}
.hstat b{font:700 23px var(--fd);letter-spacing:.02em}
.hstat b.pos{color:#5fe08f}.hstat b.neg{color:#ff7b72}
.cont{flex:none;width:290px;padding:0 max(26px,env(safe-area-inset-right,0px)) 0 56px;clip-path:polygon(15% 0,100% 0,100% 100%,0 100%);background:linear-gradient(135deg,var(--or2),#ff5400);color:#fff;display:flex;align-items:center;justify-content:center;gap:12px;font:800 29px var(--fd);letter-spacing:.08em;text-transform:uppercase;transition:filter .15s}
.cont:hover{filter:brightness(1.08)}.cont svg{width:24px;height:24px;flex:none}
.cont[disabled]{background:var(--ink3);color:var(--inkM);cursor:default;filter:none}

.club{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:linear-gradient(#22262c,#191c21);color:var(--inkT);padding-block:10px;border-top:1px solid #ffffff12}
.club .crest{width:50px;height:62px;flex:none;filter:drop-shadow(0 3px 5px #0009)}
.club h2{font:800 27px/1 var(--fd);letter-spacing:.03em;text-transform:uppercase}
.who{display:flex;align-items:center;gap:8px;margin-top:4px;font-weight:600;color:#cfd4da;font-size:14.5px}
.meters{display:flex;gap:22px;flex-wrap:wrap;margin-left:18px}
.meter{width:150px}
.meter small{font:600 12px var(--fd);letter-spacing:.16em;color:var(--inkM);display:flex;justify-content:space-between;text-transform:uppercase}
.meter small b{color:var(--inkT)}
.bar{height:6px;background:#ffffff16;margin-top:6px;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--or),#ffb35c);border-radius:3px}
.icons{margin-left:auto;display:flex;gap:2px}
.ic{position:relative;width:82px;height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;border-radius:4px;color:var(--inkT)}
.ic:hover{background:#ffffff10}
.ic svg{width:26px;height:26px}
.ic span{font:700 13px var(--fd);letter-spacing:.12em;text-transform:uppercase}
.ic em{position:absolute;top:5px;left:47px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--r);color:#fff;font:normal 700 12px var(--fb);display:flex;align-items:center;justify-content:center;border:2px solid var(--ink2)}
.ic em.o{background:var(--or)}

.navw{background:var(--ink);border-bottom:4px solid var(--or);overflow-x:auto;scrollbar-width:none}
.nav{display:flex;min-width:100%;width:max-content}
.nav button{flex:1 0 auto;min-width:118px;height:52px;padding:0 16px;font:700 18px var(--fd);letter-spacing:.08em;text-transform:uppercase;color:#e3e6ea;border-right:1px solid #ffffff12}
.nav button:hover{background:#ffffff0c}
.nav button.on{background:linear-gradient(var(--or2),#ff6100);color:#fff;box-shadow:inset 0 2px #ffffff40}
.nav button em{font-style:normal;background:var(--r);color:#fff;font:700 11px var(--fb);padding:1px 6px;border-radius:9px;margin-left:6px;vertical-align:3px}

/* ===== Main & cards ===== */
.main{padding-block:20px 48px}
.inner{max-width:1860px;margin:0 auto}
.card{background:var(--card);border-radius:3px;box-shadow:0 1px 2px #0000000f,0 8px 22px #0000000b;overflow:hidden;min-width:0}
.ch{min-height:44px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 18px 6px 22px;background:var(--ink);color:var(--inkT);position:relative;flex-wrap:wrap}
.ch::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--or)}
.ch h3{font:800 20px var(--fd);letter-spacing:.07em;text-transform:uppercase}
.lnk{font:600 13px var(--fd);letter-spacing:.12em;color:#a5acb5;text-transform:uppercase}
.lnk:hover{color:#fff}
.cb{padding:16px 18px}
.stack{display:flex;flex-direction:column;gap:20px;min-width:0}
.g-home{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1.05fr) minmax(0,.95fr);gap:20px;align-items:start}
.g-2{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:20px;align-items:start}
.g-2e{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:start}
.g-3e{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;align-items:start}
.g-match{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr) minmax(0,.8fr);gap:20px;align-items:start}
@media(max-width:1320px){.g-home{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}.g-home>.stack:last-child{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.g-match{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.g-match>:last-child{grid-column:1/-1}}
@media(max-width:1000px){.g-2,.g-3e{grid-template-columns:minmax(0,1fr)}}
@media(max-width:820px){.g-home,.g-2e,.g-match{grid-template-columns:minmax(0,1fr)}.g-home>.stack:last-child{display:flex}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 20px;font:800 17px var(--fd);letter-spacing:.09em;text-transform:uppercase;border:2px solid var(--ink);color:var(--ink);background:var(--card);border-radius:2px;transition:background .12s,color .12s}
.btn:hover{background:var(--ink);color:var(--inkT)}
.btn.p{background:var(--or);border-color:var(--or);color:#fff}
.btn.p:hover{background:#e85f00;border-color:#e85f00}
.btn.sm{min-height:32px;padding:0 12px;font-size:14px}
.btn[disabled]{opacity:.4;cursor:default;background:var(--card);color:var(--ink)}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btns .btn{flex:1 1 160px}
.aw{border:1px solid var(--line);background:var(--card);border-left:4px solid var(--or);padding:14px 18px;margin-bottom:20px;display:grid;gap:10px}
.aw-h small{display:block;font:700 12px var(--fd);letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}.aw-h b{font:800 20px var(--fd);letter-spacing:.03em;text-transform:uppercase}
.aw-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px 20px}.aw-r{display:flex;flex-direction:column;gap:2px;min-width:0}
.aw-r span{font:700 11px var(--fd);letter-spacing:.12em;text-transform:uppercase;color:var(--or)}.aw-r b{font:700 15px var(--fb)}.aw-r small{color:var(--mut);font:500 12.5px var(--fb)}
.aw-f{grid-column:1/-1}.aw-f b{font:600 14px var(--fb);line-height:1.6}
.cnav{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 24px;padding:16px 18px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--or);margin-bottom:20px}
.cnav-pick{display:grid;grid-template-columns:auto;gap:6px;min-width:0;flex:1 1 320px;max-width:520px}
.cnav label,.cnav-mine span{font:700 12px var(--fd);letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.cnav small{font:500 12px var(--fb);color:var(--mut)}
.cnav-sel{position:relative}.cnav-sel:after{content:"";position:absolute;right:16px;top:50%;width:9px;height:9px;border-right:2px solid var(--or);border-bottom:2px solid var(--or);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.cnav select{width:100%;appearance:none;-webkit-appearance:none;padding:11px 44px 11px 14px;font:700 17px var(--fd);letter-spacing:.04em;color:var(--tx);background:var(--soft);border:1px solid var(--line);border-radius:3px;cursor:pointer}
.cnav select:hover,.cnav select:focus{border-color:var(--ink);outline:none}
.cnav-mine{display:flex;flex-wrap:wrap;align-items:center;gap:6px}.cnav-mine span{margin-right:4px}
.cnav-mine button{padding:7px 14px;font:700 13px var(--fd);letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);background:var(--soft);border-radius:2px;color:var(--tx)}
.cnav-mine button.on{background:var(--ink);border-color:var(--ink);color:var(--inkT);box-shadow:inset 0 -3px var(--or)}
.cnav-mine button:hover:not(.on){border-color:var(--ink)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.splg{display:block;flex:none;aspect-ratio:2/1;max-width:100%;border:1px solid var(--line);border-radius:4px;background-color:#fff;background-image:url(sprites/l0.jpg?v=2);background-size:1000% 1000%;background-repeat:no-repeat}
.seg button{padding:7px 14px;font:700 14px var(--fd);letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);background:var(--soft);border-radius:2px;color:var(--tx)}
.seg button.on{background:var(--ink);border-color:var(--ink);color:var(--inkT);box-shadow:inset 0 -3px var(--or)}
.seg button:hover:not(.on){border-color:var(--ink)}
.tag{display:inline-block;font:800 15px var(--fd);letter-spacing:.07em;background:var(--ink);color:var(--inkT);padding:5px 12px;border-left:5px solid var(--or);text-transform:uppercase;white-space:nowrap}
.pill{display:inline-block;font:700 12px var(--fd);letter-spacing:.08em;padding:2px 8px;border-radius:2px;text-transform:uppercase;white-space:nowrap}
.pill.g{background:#dff4e7;color:#13703a}.pill.r{background:#fbe1df;color:#a3221b}.pill.y{background:#fdf1cf;color:#8a6400}.pill.b{background:#e0eafb;color:#1f4fa3}.pill.o{background:var(--orL);color:#a64400}.pill.k{background:var(--soft);color:var(--mut)}
.empty{padding:28px 22px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.empty h4{font:800 22px var(--fd);text-transform:uppercase;letter-spacing:.04em}
.lbl{font:700 13px var(--fd);letter-spacing:.14em;color:var(--mut);text-transform:uppercase}

/* tables */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font:700 13px var(--fd);letter-spacing:.1em;color:var(--mut);text-align:left;padding:10px 8px 8px;border-bottom:2px solid var(--ink);text-transform:uppercase;white-space:nowrap;background:var(--card)}
td{padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;height:38px}
th.n,td.n{text-align:center}th.r,td.r{text-align:right}
td.rk{font:800 17px var(--fd);text-align:center;width:38px}
tr.z1 td.rk{box-shadow:inset 4px 0 var(--g)}tr.z2 td.rk{box-shadow:inset 4px 0 var(--b)}tr.z3 td.rk{box-shadow:inset 4px 0 var(--r)}
tr.me td{background:var(--orS);font-weight:700}tr.me td.rk{box-shadow:inset 4px 0 var(--or);color:var(--or)}
tr.click{cursor:pointer}.clubh{width:72px;height:72px;flex:none;display:flex;align-items:center;justify-content:center;overflow:hidden}.clubh .crest{width:64px!important;height:64px!important;max-width:64px;max-height:64px;margin:0;object-fit:contain}.side.click,.tm.click{cursor:pointer}.tm.click:hover .nm,.side.click:hover h4{text-decoration:underline}tr.click:hover td{background:var(--soft)}
tr.sel td{background:var(--orL)!important}
tr.grp td{background:var(--soft);font:700 12px var(--fd);letter-spacing:.16em;color:var(--mut);text-transform:uppercase;height:28px;padding-block:4px}
.mini{display:inline-flex;width:26px;height:26px;border-radius:50%;align-items:center;justify-content:center;font:800 10.5px var(--fd);margin-right:9px;vertical-align:middle;box-shadow:inset 0 0 0 2px #ffffff60,0 0 0 1px #00000018;flex:none;letter-spacing:0}
.fm{display:inline-flex;gap:3px;vertical-align:middle}
.fm span{width:19px;height:19px;display:flex;align-items:center;justify-content:center;font:800 11.5px var(--fd);color:#fff;border-radius:2px}
.fm .W{background:var(--g)}.fm .L{background:var(--r)}
.ovr{display:inline-block;min-width:34px;text-align:center;font:800 16px var(--fd);padding:2px 5px;border-radius:2px;color:#fff}
.o1{background:#0f8a43}.o2{background:#59a51f}.o3{background:#c99a00}.o4{background:#d7701c}.o5{background:#9aa1a9}
.eb{display:inline-block;width:56px;height:6px;background:var(--line);border-radius:3px;overflow:hidden;vertical-align:middle}
.eb i{display:block;height:100%}
.mv{display:inline-flex;gap:2px}
.mv button{width:26px;height:26px;border:1px solid var(--line);border-radius:2px;font-size:11px;color:var(--mut);background:var(--card)}
.mv button:hover{border-color:var(--ink);color:var(--ink)}

/* next match */
.nm-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 22px 0;flex-wrap:wrap}
.nm-top .comp{font:800 20px/1.1 var(--fd);letter-spacing:.04em;text-transform:uppercase}
.nm-top .comp span{display:block;color:var(--mut);font-weight:600;font-size:16px}
.versus{display:grid;grid-template-columns:minmax(0,1fr) minmax(150px,240px) minmax(0,1fr);align-items:center;padding:6px 18px 14px;background:radial-gradient(ellipse at 50% 55%,#f3f4f6 0,var(--card) 65%)}
.side{text-align:center;min-width:0}
.side .crest{height:118px;width:96px;filter:drop-shadow(0 10px 14px #00000038)}
.side h4{font:800 24px/1 var(--fd);letter-spacing:.03em;margin-top:8px;text-transform:uppercase}
.side p{font:600 15px var(--fd);color:var(--mut);letter-spacing:.08em;text-transform:uppercase;margin:2px 0 8px}
.vsb{width:80px;height:80px;margin:0 auto;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font:italic 900 34px var(--fd);box-shadow:0 0 0 5px var(--card),0 0 0 8px var(--or),0 12px 24px #0004}
.ko{margin-top:18px;font:800 23px/1.05 var(--fd);letter-spacing:.04em;text-transform:uppercase;text-align:center}
.ven{font-size:13px;color:var(--mut);margin-top:4px;font-weight:600;text-align:center}
.prob{margin:0 22px;display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--line)}
.prob i{display:block;height:100%}
.probl{display:flex;justify-content:space-between;margin:6px 22px 0;font:700 14px var(--fd);letter-spacing:.08em;text-transform:uppercase}
.info{margin:12px 22px 0;border-top:1px solid var(--line)}
.info div{display:flex;justify-content:space-between;align-items:center;gap:16px;min-height:36px;padding-block:6px;border-bottom:1px solid var(--line);font-size:14.5px;font-weight:500}
.info div span{text-align:right}
.info b{font:800 15px var(--fd);letter-spacing:.12em;color:var(--or);text-transform:uppercase;white-space:nowrap}
.nm-btns{padding:14px 22px 18px}

.fx{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.fx>div{padding:12px 14px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);position:relative;min-width:0}
.fx small{font:700 12.5px var(--fd);letter-spacing:.12em;color:var(--mut);display:block;text-transform:uppercase}
.fx b{font:800 18px var(--fd);display:block;margin-top:3px;letter-spacing:.02em;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fx span{font-size:13px;color:var(--mut);font-weight:500}
.fx .res{position:absolute;top:11px;right:11px;font:800 12px var(--fd);color:#fff;padding:1px 6px;border-radius:2px}
.fx .nxt{background:var(--orS);box-shadow:inset 0 -3px var(--or)}
.fx .nxt small{color:var(--or)}
.rg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.rg>div{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);font-size:14px;font-weight:500}
.rg>div:nth-child(odd){border-right:1px solid var(--line)}
.rg .sc{font:800 16px var(--fd);letter-spacing:.03em;white-space:nowrap}
.rg .tm{display:flex;align-items:center;gap:8px;min-width:0;white-space:nowrap}
.rg .tm .nm{overflow:hidden;text-overflow:ellipsis;min-width:0}
.rg .tm .mini{flex:none;margin:0}
.rg .tm.r{justify-content:flex-end;text-align:right}
.rg .w{font-weight:700}
.rg .me{color:var(--or);font-weight:700}
@media(max-width:600px){.rg{grid-template-columns:minmax(0,1fr)}.rg>div:nth-child(odd){border-right:0}}

.msg{display:flex;gap:13px;padding:12px 18px;border-bottom:1px solid var(--line);align-items:center;width:100%;text-align:left}
button.msg:hover{background:var(--soft)}
.msg.on{background:var(--orS)}
.mi{width:38px;height:38px;flex:none;border-radius:3px;display:flex;align-items:center;justify-content:center;color:#fff;font:800 16px var(--fd)}
.msg b{display:block;font-weight:700;font-size:14.5px;line-height:1.25}
.msg small{color:var(--mut);font-size:12.5px;font-weight:500}
.msg.u b::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--or);margin-right:7px;vertical-align:2px}
.msgbody{padding:22px;display:flex;flex-direction:column;gap:14px;max-width:70ch}
.msgbody h3{font:800 26px/1.1 var(--fd);text-transform:uppercase;letter-spacing:.02em}
.msgbody p{line-height:1.6}

.spot{display:flex;gap:18px;padding:18px;align-items:center;background:linear-gradient(120deg,var(--card) 50%,var(--orS));flex-wrap:wrap}
.avatar{width:84px;height:84px;flex:none;border-radius:50%;background:linear-gradient(#2a2e35,#121417);display:flex;align-items:center;justify-content:center;color:#fff;font:900 36px var(--fd);box-shadow:0 0 0 4px var(--card),0 0 0 6px var(--or)}
.spot h4{font:800 24px/1 var(--fd);text-transform:uppercase}
.spot p{font-size:13px;color:var(--mut);font-weight:600;margin-top:3px}
.sts{display:flex;gap:16px;margin-top:10px;flex-wrap:wrap}
.sts div{font:600 12px var(--fd);letter-spacing:.14em;color:var(--mut)}
.sts b{display:block;font-size:25px;color:var(--tx);font-weight:800;letter-spacing:0;line-height:1}
